<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Grid</title>
<style>
  :root { --bg:#f4f4f6; --panel:#fff; --ink:#1c1c22; --muted:#6b6b76; --accent:#4f46e5; --border:#dcdce2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --panel:#212127; --ink:#ececf1; --muted:#9a9aa6; --accent:#818cf8; --border:#34343c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px; }
  .bar { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; justify-content:center;
         background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); }
  select, button, input[type=range] { font:inherit; }
  select, button { background:var(--bg); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:#dc2626; border-color:#dc2626; color:#fff; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  canvas { background:#fff; border:1px solid var(--border);
           border-radius:8px; cursor:crosshair; touch-action:none; }
  .hint { color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
  <div class="bar">
    <label>Columns <select id="cols"></select></label>
    <label>Rows <select id="rows"></select></label>
    <label>Width <input id="w" type="range" min="10" max="120" step="5" value="60"><output id="wv">60</output></label>
    <label>Height <input id="h" type="range" min="10" max="120" step="5" value="60"><output id="hv">60</output></label>
    <label>Thickness <input id="thick" type="range" min="1" max="12" value="3"></label>
    <label><input id="expGrid" type="checkbox"> Grid in export</label>
    <button id="erase">Erase: off</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="export" class="primary">Export PNG</button>
  </div>
  <canvas id="c"></canvas>
  <div class="hint">Click a dot to start, click another to draw a line (it keeps chaining). Shift+click a dot to move the start without drawing; Esc or right-click lets go. Ctrl/Cmd+Z to undo. Turn on Erase, then click any line to delete it.</div>

<script>
const PAD = 2.4;                       // margin around the grid, in grid units
const FACTORS = [1,2,3,4,5,6,10,12,15,20,30,60];
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const colsEl = $('cols'), rowsEl = $('rows');

for (const el of [colsEl, rowsEl]) {
  for (const f of FACTORS) el.add(new Option(f, f));
  el.value = 10;
}

const lines = [];          // [x1, y1, x2, y2] in grid units, independent of the dot counts
let start = null;          // {i, j} of the pending start point
let hover = null;
let erasing = false;
let hot = -1;             // index of the line under the cursor in erase mode

const cols = () => +colsEl.value;
const rows = () => +rowsEl.value;
const W = () => +$('w').value;
const H = () => +$('h').value;
const TW = () => W() + 2 * PAD;
const TH = () => H() + 2 * PAD;
const pos = (i, n, size) => (i + 0.5) * size / n;   // dot i of n, centred in its cell

function draw(c, cw, ch, { points, grid }) {
  const k = cw / TW();                 // pixels per grid unit
  const X = u => (u + PAD) * k;
  c.fillStyle = '#fff';
  c.fillRect(0, 0, cw, ch);

  if (grid) {
    c.strokeStyle = '#d8d8de';
    c.lineWidth = Math.max(1, k / 11);
    c.beginPath();
    for (let i = 0; i < cols(); i++) { const x = X(pos(i, cols(), W())); c.moveTo(x, X(0)); c.lineTo(x, X(H())); }
    for (let j = 0; j < rows(); j++) { const y = X(pos(j, rows(), H())); c.moveTo(X(0), y); c.lineTo(X(W()), y); }
    c.stroke();
  }

  c.strokeStyle = '#111';
  c.lineCap = 'round';
  c.lineWidth = +$('thick').value * k / 11;
  c.beginPath();
  lines.forEach(([x1, y1, x2, y2], n) => {
    if (points && n === hot) return;
    c.moveTo(X(x1), X(y1)); c.lineTo(X(x2), X(y2));
  });
  c.stroke();
  if (points && hot >= 0) {
    const [x1, y1, x2, y2] = lines[hot];
    c.strokeStyle = '#dc2626';
    c.beginPath(); c.moveTo(X(x1), X(y1)); c.lineTo(X(x2), X(y2)); c.stroke();
  }

  if (points) {
    const r = Math.max(1.5, Math.min(4, Math.min(W() / cols(), H() / rows()) * k / 4));
    c.fillStyle = '#9a9aa8';
    for (let i = 0; i < cols(); i++)
      for (let j = 0; j < rows(); j++) {
        c.beginPath(); c.arc(X(pos(i, cols(), W())), X(pos(j, rows(), H())), r, 0, 7); c.fill();
      }
    c.fillStyle = '#4f46e5';
    for (const p of [start, hover]) {
      if (!p) continue;
      c.beginPath(); c.arc(X(pos(p.i, cols(), W())), X(pos(p.j, rows(), H())), r * 2.2, 0, 7); c.fill();
    }
  }
}

function render() {
  $('wv').value = W(); $('hv').value = H();
  const m = Math.max(TW(), TH());
  const avail = Math.min(window.innerWidth - 32, 720);
  canvas.style.width = avail * TW() / m + 'px';
  canvas.style.aspectRatio = TW() + '/' + TH();
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(ctx, cw, ch, { points: true, grid: true });
}

// mouse position in grid units
function unitsAt(e) {
  const rect = canvas.getBoundingClientRect();
  const k = rect.width / TW();
  return { k, x: (e.clientX - rect.left) / k - PAD, y: (e.clientY - rect.top) / k - PAD };
}

function pointAt(e) {
  const { x, y } = unitsAt(e);
  const snap = (f, n) => Math.min(n - 1, Math.max(0, Math.round(f * n - 0.5)));
  return { i: snap(x / W(), cols()), j: snap(y / H(), rows()) };
}

const toUnits = p => [pos(p.i, cols(), W()), pos(p.j, rows(), H())];

function lineAt(e) {
  const { k, x: px, y: py } = unitsAt(e);
  let best = -1, bestD = 10 / k;   // pick radius: 10 screen px
  lines.forEach(([x1, y1, x2, y2], n) => {
    const dx = x2 - x1, dy = y2 - y1;
    const t = Math.min(1, Math.max(0, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy)));
    const d = Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    if (d < bestD) { bestD = d; best = n; }
  });
  return best;
}

canvas.addEventListener('pointermove', e => {
  if (erasing) hot = lineAt(e); else hover = pointAt(e);
  render();
});
canvas.addEventListener('pointerleave', () => { hover = null; hot = -1; render(); });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); start = null; render(); });
canvas.addEventListener('click', e => {
  if (erasing) {
    const n = lineAt(e);
    if (n >= 0) lines.splice(n, 1);
    hot = lineAt(e);
    render();
    return;
  }
  const p = pointAt(e);
  if (!e.shiftKey && start && (start.i !== p.i || start.j !== p.j)) {
    lines.push([...toUnits(start), ...toUnits(p)]);
  }
  start = p;
  render();
});

function undo() { lines.pop(); hot = -1; render(); }
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { start = null; render(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});

colsEl.onchange = rowsEl.onchange = () => { start = null; render(); };
$('w').oninput = $('h').oninput = $('thick').oninput = render;
$('erase').onclick = () => {
  erasing = !erasing;
  start = hover = null; hot = -1;
  $('erase').textContent = 'Erase: ' + (erasing ? 'on' : 'off');
  $('erase').classList.toggle('on', erasing);
  canvas.style.cursor = erasing ? 'pointer' : '';
  render();
};
$('undo').onclick = undo;
$('clear').onclick = () => { lines.length = 0; start = null; hot = -1; render(); };
$('export').onclick = () => {
  const m = Math.max(TW(), TH());
  const out = document.createElement('canvas');
  out.width = Math.round(2400 * TW() / m);
  out.height = Math.round(2400 * TH() / m);
  draw(out.getContext('2d'), out.width, out.height, { points: false, grid: $('expGrid').checked });
  out.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'line-grid.png';
    a.click();
    URL.revokeObjectURL(a.href);
  });
};

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
